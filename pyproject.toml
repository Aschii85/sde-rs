[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "sde-rs"
dynamic = ["version"]
description = "Powerful and flexible SDE simulation library with Rust-accelerated Monte-Carlo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [
    {name = "Alexander Schierbeck-Hansen", email = "aschii85@protonmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.2.6",
    "xarray>=2025.6.1",
]

[tool.maturin]
manifest-path = "crates/sde-rs-py/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "sde_rs._core" # Rust submodule location

[tool.uv]
# rebuild when the Rust sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.7",
    "maturin>=1.9.0",
    "pandas>=2.3.3",
    "plotly>=6.6.0",
]
