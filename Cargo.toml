[workspace]
members = ["crates/sde-rs", "crates/sde-rs-py"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["Alexander Schierbeck-Hansen <aschii85@protonmail.com>"]
repository = "https://github.com/Aschii85/sde-rs"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"      # see warning below
strip = false
